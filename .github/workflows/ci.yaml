name: metaextract

on:
  - push
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install tox and any other packages
        run: pip install tox
      - name: Run tox
        run: tox -e pep8
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox and any other packages
        run: pip install tox
      - name: Run tox
        # Run tox using the version of Python in `PATH`
        run: tox -e py
  setuptools:
    # setuptools < 66 does not work with python >= 3.12
    runs-on: ubuntu-latest
    strategy:
      matrix:
        setuptools: ["61", "69", "77"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tox and any other packages
        run: pip install tox
      - name: Run tox
        run: tox -e py-setuptools${{ matrix.setuptools }}
