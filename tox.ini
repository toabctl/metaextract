[tox]
envlist = py3,py3-setuptools{61,69,77},pep8
minversion = 1.6

[testenv]
usedevelop = True
install_command = pip install -U {opts} {packages}
setenv = VIRTUAL_ENV={envdir}
deps = -r{toxinidir}/test-requirements.txt
    setuptools61: setuptools==61.*
    setuptools69: setuptools==69.*
    setuptools77: setuptools==77.*

commands = py.test -v {posargs} metaextract

[testenv:pep8]
commands = flake8

[testenv:venv]
commands = {posargs}

[flake8]
ignore =
exclude =  .venv,.git,.tox,dist,doc,*lib/python*,*egg,build

[testenv:docs]
commands =
  python setup.py build_sphinx
